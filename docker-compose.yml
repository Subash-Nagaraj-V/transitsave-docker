services:
  transitsave-app:
    build: .
    image: transitsave:v3
    container_name: transitsave
    ports:
      - "3000:80"
    volumes:
      - transitsave-logs:/var/log/transitsave
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - transitsave-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  transitsave-logs:

networks:
  transitsave-net:
    driver: bridge
