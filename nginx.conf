server {
    listen 80;
    server_name _;
    access_log /var/log/transitsave/access.log;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build files never change, so cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA files must never be cached, or users get stuck on old versions
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Used later by the Docker healthcheck (Phase 6)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
